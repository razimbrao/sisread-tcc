services:
  app:
    build: .
    image: sisread:latest
    restart: unless-stopped
    stop_grace_period: 11m
    env_file: .env.production
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --resolve $${SERVER_NAME}:443:127.0.0.1 https://$${SERVER_NAME}/up || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 60s
